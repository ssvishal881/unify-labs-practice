<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TITAN Marketplace</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header>
<h1>TITAN Marketplace</h1>
<input id="search" placeholder="Search products..." oninput="loadProducts()">
<select id="categoryFilter" onchange="loadProducts()">
<option value="">All Categories</option>
<option value="Electronics">Electronics</option>
<option value="Clothing">Clothing</option>
<option value="Furniture">Furniture</option>
</select>
</header>

<section class="grid" id="productGrid"></section>

<section class="cart">
<h2>Shopping Cart</h2>
<div id="cartItems"></div>
<button onclick="checkout()">Checkout</button>
</section>

<section class="checkout">
<h2>Checkout Form</h2>
<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">
<button onclick="submitOrder()">Submit Order</button>
</section>

<script>

const API = "http://localhost:3000/api";
let cart = JSON.parse(localStorage.getItem("cart")) || [];

async function loadProducts() {

const search = document.getElementById("search").value.toLowerCase();
const category = document.getElementById("categoryFilter").value;

let url = API + "/products";
if(category) url += "?category=" + category;

const res = await fetch(url);
let products = await res.json();

products = products.filter(p =>
p.name.toLowerCase().includes(search)
);

const grid = document.getElementById("productGrid");
grid.innerHTML = "";

products.forEach(p => {

grid.innerHTML += `
<div class="card">
<h3>${p.name}</h3>
<p>$${p.price}</p>
<button onclick="addToCart('${p._id}', '${p.name}', ${p.price})">
Add to Cart
</button>
</div>
`;
});
}

function addToCart(id, name, price) {

cart.push({ id, name, price });
localStorage.setItem("cart", JSON.stringify(cart));

renderCart();
}

function renderCart() {

const container = document.getElementById("cartItems");
container.innerHTML = "";

cart.forEach(item => {

container.innerHTML += `
<p>${item.name} - $${item.price}</p>
`;
});
}

function checkout() {
alert("Proceed to fill checkout form");
}

async function submitOrder() {

const order = {
customer: {
name: name.value,
email: email.value,
address: address.value
},
items: cart,
createdAt: new Date()
};

await fetch(API + "/orders", {

method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify(order)

});

alert("Order placed successfully!");
cart = [];
localStorage.removeItem("cart");
renderCart();
}

renderCart();
loadProducts();

</script>

</body>
</html>
