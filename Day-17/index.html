<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Master Data Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Task Master Data Dashboard</h1>

<div class="dashboard">

    <div class="card">
        <h3>Total Projects Info</h3>
        <p id="totalProjects"></p>
        <p id="averageMarks"></p>
    </div>

    <div class="card">
        <h3>Actions</h3>
        <button id="showAllBtn">Show All Projects</button>
        <button id="showCompletedBtn">Show Completed Projects</button>
    </div>

    <div class="card">
        <h3>Project List</h3>
        <ul id="projectList"></ul>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
