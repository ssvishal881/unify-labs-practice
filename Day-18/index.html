<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital Pet Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Digital Pet Simulator</h1>

<div class="container">

    <div class="card">
        <h2 id="petName">Pet: Buddy</h2>
        <p id="hunger">Hunger: 50</p>
        <p id="energy">Energy: 50</p>
        <p id="status">Status: Happy 😊</p>
    </div>

    <div class="card">
        <h3>Actions</h3>
        <button id="eatBtn">Feed Pet 🍎</button>
        <button id="playBtn">Play 🎮</button>
        <button id="sleepBtn">Sleep 😴</button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
